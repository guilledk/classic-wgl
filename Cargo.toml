[workspace]
resolver = "2"
members = [
    "crates/classic-core",
    "crates/classic-pathfinder",
    "crates/classic-pathfinder-wasm",
    "crates/classic-worker",
    "crates/classic-terrain",
    "crates/classic-gfx",
    "crates/classic-platform",
    "crates/classic-engine",
    "crates/classic-rom",
    "crates/classic-guest",
    "crates/classic-demo",
    "apps/desktop",
    "apps/web",
    "xtask",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/guilledk/classic-wgl"

[workspace.dependencies]
# Math
glam = { version = "0.29", features = ["serde"] }

# ECS
hecs = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Graphics
glow = "0.16"

# Windowing & input (native)
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"

# Async runtime for native
pollster = "0.4"

# Blocking HTTP client (native ROM fetch)
ureq = "2"

# Image loading (PNG, etc.)
image = { version = "0.25", default-features = false, features = ["png"] }

# Error handling
anyhow = "1"
thiserror = "2"
base64 = "0.22"

# Archive reading (ROM packaging)
zip = { version = "4", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"

# Guest code runtime (WASM interpreter for ROM guest modules)
wasmi = "0.41"

# Safe GPU data casting
bytemuck = { version = "1", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlDivElement",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlTexture",
    "WebGlBuffer",
    "WebGlFramebuffer",
    "WebGlRenderbuffer",
    "AngleInstancedArrays",
    "OesStandardDerivatives",
    "Worker",
    "Blob",
    "Url",
    "XmlHttpRequest",
    "XmlHttpRequestEventTarget",
    "XmlHttpRequestResponseType",
    "Response",
    "Cache",
    "CacheStorage",
] }
js-sys = "0.3"
gloo-net = "0.6"
console_error_panic_hook = "0.1"

# Optimize the rarely-rebuilt decode/compression dependencies even in dev
# builds: debug-mode PNG decoding of the large shared atlases dominates ROM
# boot time (~10MB/s unoptimized), so keep these hot dependencies at
# opt-level 3 while our own crates stay opt-level 0 for fast iteration.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.zstd]
opt-level = 3

[profile.dev.package.zstd-safe]
opt-level = 3

[profile.dev.package.ruzstd]
opt-level = 3
