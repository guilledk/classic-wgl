[workspace]
resolver = "2"
members = [
    "crates/classic-core",
    "crates/classic-worker",
    "crates/classic-terrain",
    "crates/sdf-atlas",
    "crates/classic-gfx",
    "crates/classic-platform",
    "crates/classic-engine",
    "crates/classic-rom",
    "crates/classic-guest",
    "crates/classic-demo",
    "apps/desktop",
    "apps/web",
    "xtask",
]
# ROM guest crates are standalone #![no_std] cdylibs built only for
# wasm32-unknown-unknown (see the `xtask` guests subcommand); they are not host
# code and must not be compiled by the default workspace build.
exclude = ["guest"]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/guilledk/classic-wgl"

[workspace.dependencies]
# Math
glam = { version = "0.29", features = ["serde"] }

# ECS
hecs = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Graphics
glow = "0.16"

# Windowing & input (native)
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"

# Async runtime for native
pollster = "0.4"

# Blocking HTTP client (native ROM fetch)
ureq = "2"

# Image loading (PNG, etc.)
image = { version = "0.25", default-features = false, features = ["png"] }

# Error handling
anyhow = "1"
thiserror = "2"
base64 = "0.22"

# Archive reading (ROM packaging)
zip = { version = "4", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"

# Guest code runtime (WASM interpreter for ROM guest modules)
wasmi = "0.41"

# Safe GPU data casting
bytemuck = { version = "1", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlTexture",
    "WebGlBuffer",
    "WebGlFramebuffer",
    "WebGlRenderbuffer",
    "AngleInstancedArrays",
    "OesStandardDerivatives",
    "Worker",
    "Blob",
    "Url",
    "XmlHttpRequest",
    "XmlHttpRequestEventTarget",
    "XmlHttpRequestResponseType",
] }
js-sys = "0.3"
gloo-net = "0.6"
console_error_panic_hook = "0.1"
