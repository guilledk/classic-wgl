name: CI

on:
    push:
        branches: [master, rust-port]
    pull_request:
        branches: [master, rust-port]

env:
    CARGO_TERM_COLOR: always

jobs:
    lint:
        name: lint (fmt + clippy)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - run: cargo fmt --all -- --check
            - run: cargo clippy -p classic-core -p classic-gfx -p classic-engine -p classic-platform -p classic-demo --all-targets -- -D warnings

    test:
        name: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - run: cargo test -p classic-core -p classic-gfx -p classic-engine -p classic-platform -p classic-demo -- --test-threads=1

    wasm-check:
        name: wasm check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - run: cargo check --target wasm32-unknown-unknown -p classic-core -p classic-gfx -p classic-engine -p classic-platform -p classic-demo

    golden:
        name: golden test (headless EGL)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
                  token: ${{ secrets.GH_PAT }}
            - uses: actions/setup-node@v4
              with: { node-version: 22, cache: npm }
            - run: npm ci
            - run: npm run assets
            - uses: dtolnay/rust-toolchain@stable
            - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libgbm-dev libx11-dev
            - run: cargo build -p classic-desktop
            - env:
                  LIBGL_ALWAYS_SOFTWARE: 1
                  EGL_PLATFORM: surfaceless
              run: CLASSIC_HEADLESS=1 CLASSIC_FRAMES=60 CLASSIC_TEST=all CLASSIC_GOLDEN=check RUST_LOG=info ./target/debug/classic-desktop
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: golden-artifacts
                  path: target/classic-test/

