name: CI

on:
    push:
        branches: [master]
    pull_request:

env:
    CARGO_TERM_COLOR: always

jobs:
    version:
        name: version + changelog
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: dtolnay/rust-toolchain@stable
            - name: Cargo.toml vs CHANGELOG.md
              run: cargo xtask check-version
            - name: changelog updated when code changed
              if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
              run: |
                  base="${{ github.event.pull_request.base.sha }}"
                  changed_code=$(git diff --name-only "$base...HEAD" | grep -E '^(crates|apps)/' || true)
                  changed_changelog=$(git diff --name-only "$base...HEAD" | grep -E '^CHANGELOG.md$' || true)
                  if [ -n "$changed_code" ] && [ -z "$changed_changelog" ]; then
                    echo "::error::source under crates/ or apps/ changed without a CHANGELOG.md update (add to [Unreleased], or label the PR 'skip-changelog')"
                    exit 1
                  fi
                  echo "changelog ok"

    lint:
        name: lint (fmt + clippy)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - run: cargo fmt --all -- --check
            - run: cargo clippy -p classic-core -p classic-pathfinder -p classic-terrain -p classic-worker -p classic-gfx -p classic-engine -p classic-platform -p classic-rom -p classic-guest -p classic-demo --all-targets -- -D warnings
            - name: codified patterns (AGENTS.md "Patterns")
              run: cargo xtask check-patterns

    test:
        name: test
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - run: cargo test -p classic-core -p classic-pathfinder -p classic-terrain -p classic-worker -p classic-gfx -p classic-engine -p classic-platform -p classic-rom -p classic-guest -p classic-demo

    wasm-check:
        name: wasm check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
            # The web Worker instantiates the compiled `pathfinder.wasm`, which
            # `web.rs` embeds via `include_bytes!` — build it before checking.
            - run: cargo xtask build-pathfinder
            - run: cargo check --target wasm32-unknown-unknown -p classic-core -p classic-pathfinder -p classic-pathfinder-wasm -p classic-terrain -p classic-worker -p classic-gfx -p classic-engine -p classic-platform -p classic-rom -p classic-guest -p classic-demo

    web-test:
        name: web tests (headless chrome)
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
            # Must match the `wasm-bindgen` version in Cargo.lock (see flake.nix).
            - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
            - run: cargo xtask build-pathfinder
            # The runner image ships Chrome + a matching chromedriver
            # ($CHROMEWEBDRIVER); wasm-bindgen-test-runner serves the page
            # cross-origin isolated, so SharedArrayBuffer works.
            - name: classic-guest browser tests
              env:
                  CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
              run: |
                  export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
                  cargo test --target wasm32-unknown-unknown -p classic-guest --test web

    golden:
        name: golden test (headless EGL)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            # ROMs are built by the classic-roms repo and published to an R2
            # bucket (classic-roms.com); fetch the current set instead of
            # building assets/guests from the private submodule.
            - uses: dtolnay/rust-toolchain@stable
            # Fail fast (before fetching) when the published ROMs drift from
            # the committed lockfile, so a golden failure is never a confusing
            # atlas/geometry diff against stale ROMs.
            - run: cargo xtask check-roms
            - run: cargo xtask fetch-roms
            - name: Install Mesa/EGL system deps
              env:
                  DEBIAN_FRONTEND: noninteractive
              timeout-minutes: 5
              run: |
                  sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
                  sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 libegl1-mesa-dev libgl1-mesa-dri libgbm-dev libx11-dev
            - run: cargo build -p classic-desktop
            # `CLASSIC_TEST=<name>` selects tests/scenarios/<name>.test.json via
            # the SCENARIOS table in classic-demo/src/testing.rs.  A scenario is
            # bound to ONE rom, because it names entities and those names are
            # rom-namespaced, so there is no single run that covers them all.
            #
            # `render_order` (rom:lrvtest) and `rocket` (rom:lunar) run below as
            # assertion-only steps (no trace golden: a failed assertion already
            # exits non-zero).  Both sample *colour* at points a captured frame
            # shows are solid sprite pixels, and both were checked to fail
            # when their subject is absent -- an alpha-only check over opaque
            # terrain cannot fail.  `container_ghost` stays out: its target
            # ships in no published rom.  See `classic-testing` skill
            # section 9.
            - name: demo scene (e2e assertions + golden trace)
              env:
                  LIBGL_ALWAYS_SOFTWARE: 1
                  EGL_PLATFORM: surfaceless
                  # llvmpipe's multithreaded rasterizer races on the sprite
                  # ghost-pass depth rendering; pin to a single thread.
                  LP_NUM_THREADS: 0
              run: CLASSIC_HEADLESS=1 CLASSIC_FRAMES=60 CLASSIC_TEST=default CLASSIC_GOLDEN=check RUST_LOG=info ./target/debug/classic-desktop
            - name: lrvtest scene (render_order assertions)
              env:
                  LIBGL_ALWAYS_SOFTWARE: 1
                  EGL_PLATFORM: surfaceless
                  LP_NUM_THREADS: 0
              run: >-
                  CLASSIC_ROM=rom:lrvtest CLASSIC_TEST=render_order CLASSIC_HEADLESS=1
                  CLASSIC_FRAMES=45 CLASSIC_FIXED_DT=0.016666668
                  CLASSIC_WIDTH=1280 CLASSIC_HEIGHT=720
                  RUST_LOG=info ./target/debug/classic-desktop
            # The rocket's `landing` clip touches down at t~10s.  A 0.05s step
            # reaches the same landed pose in 220 frames instead of ~620 at
            # 1/60 (~2 min vs ~6 min under llvmpipe); the scenario's frame
            # numbers assume this step.
            - name: lunar scene (rocket assertions)
              env:
                  LIBGL_ALWAYS_SOFTWARE: 1
                  EGL_PLATFORM: surfaceless
                  LP_NUM_THREADS: 0
              run: >-
                  CLASSIC_ROM=rom:lunar CLASSIC_TEST=rocket CLASSIC_HEADLESS=1
                  CLASSIC_FRAMES=225 CLASSIC_FIXED_DT=0.05
                  CLASSIC_WIDTH=1280 CLASSIC_HEIGHT=720
                  RUST_LOG=info ./target/debug/classic-desktop
            # The procedural scene needs a fixed timestep: without one the idle
            # animator lands on a different frame each run and the trace differs.
            - name: lunar scene (golden trace)
              env:
                  LIBGL_ALWAYS_SOFTWARE: 1
                  EGL_PLATFORM: surfaceless
                  # llvmpipe's multithreaded rasterizer races on the sprite
                  # ghost-pass depth rendering; pin to a single thread.
                  LP_NUM_THREADS: 0
              run: >-
                  CLASSIC_ROM=rom:lunar CLASSIC_HEADLESS=1 CLASSIC_FRAMES=60
                  CLASSIC_FIXED_DT=0.016666668 CLASSIC_WIDTH=1280 CLASSIC_HEIGHT=720
                  CLASSIC_GOLDEN=check CLASSIC_GOLDEN_DIR=tests/golden/lunar
                  RUST_LOG=info ./target/debug/classic-desktop
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: golden-artifacts
                  path: target/classic-test/

