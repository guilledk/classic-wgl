[package]
name = "demo-guest"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: the guest crates are built out-of-workspace (via `--manifest-path`)
# so they declare their own empty workspace rather than inheriting the parent's.
[workspace]

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
dlmalloc = { version = "0.2", features = ["global"] }
