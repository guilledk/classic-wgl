[package]
name = "lunar-worker"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: the guest crates are built out-of-workspace (via `--manifest-path`)
# so they declare their own empty workspace rather than inheriting the parent's.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
classic-terrain = { path = "../../crates/classic-terrain" }
libm = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", features = ["global"] }

[dev-dependencies]
classic-core = { path = "../../crates/classic-core" }
