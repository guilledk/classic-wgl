[package]
name = "classic-platform"
version.workspace = true
edition.workspace = true

[features]
default = []
native = ["glutin", "glutin-winit", "raw-window-handle", "x11"]

[dependencies]
classic-core = { path = "../classic-core" }
classic-gfx = { path = "../classic-gfx" }
classic-rom = { path = "../classic-rom" }

glam.workspace = true
glow.workspace = true
winit.workspace = true
anyhow.workspace = true
log.workspace = true
pollster.workspace = true

# Native-only, feature-gated (prevent -lX11 from leaking into wasm builds)
glutin = { workspace = true, optional = true }
glutin-winit = { workspace = true, optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }
x11 = { version = "2", optional = true }

# Headless EGL (native only, no window)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"
ureq = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
js-sys.workspace = true
gloo-net.workspace = true
console_error_panic_hook.workspace = true
serde_json.workspace = true
