[package]
name = "classic-gfx"
version.workspace = true
edition.workspace = true

[dependencies]
classic-core = { path = "../classic-core" }

glow.workspace = true
glam.workspace = true
image.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
bytemuck.workspace = true

# Phase 1 GPU-compressed storage: transcode Basis Universal `.basis` payloads
# to the GPU's native compressed format at load.  Native-only (a C++ codec);
# the web path uses a separate precompiled transcoder `.wasm` (see P1.0/R2).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
basis-universal = "0.3.1"

# Web Basis Universal transcoder (P1.0/R3): our own Emscripten-built
# `basis_transcoder.wasm`, run in a web Worker (async) with a synchronous
# main-thread fallback.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
